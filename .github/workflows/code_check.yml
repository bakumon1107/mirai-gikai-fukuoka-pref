name: Code Check

on:
  # 福岡県版の統合ブランチ。川崎版からのfork時の設定（kawasaki/develop）が
  # 残っていたため、このワークフローは一度も起動していなかった
  push:
    branches: [fukuoka-pref/develop]
  pull_request:
    branches: [fukuoka-pref/develop]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome lint & format check
        run: pnpm run lint

      - name: Run TypeScript type checking
        run: pnpm run typecheck

      # test:coverage スクリプトを持つのは web だけなので、これだけだと
      # admin・packages のテストが CI で一度も走らない。全体を先に流す
      - name: Run all workspace tests
        run: pnpm run test

      - name: Run web tests with coverage
        run: pnpm --filter web run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5
        with:
          files: ./web/coverage/coverage-final.json
          token: ${{ secrets.CODECOV_TOKEN }}
