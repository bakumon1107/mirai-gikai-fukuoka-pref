# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# レビューコメント・サマリーを日本語で生成する
language: ja-JP

reviews:
  profile: chill
  # CodeRabbitのコメントがresolve済みになったら自動approveする挙動。
  # 旧設定の request_changes_workflow: auto とは意味が違うため既定のfalseにしている。
  request_changes_workflow: false
  high_level_summary: true

  # ノイズになるものだけ除外する（"!" が除外）。
  # 旧設定は admin/web/packages/supabase/docs を include する形だったが、それでは
  # tests/** やルートの設定ファイル（biome.json, package.json 等）がレビュー対象から
  # 外れてしまうため、除外のみの指定に変更した。
  # Markdown も除外しない（docs/ の設計文書に対するレビューが有用なため）。
  path_filters:
    - "!**/*.svg"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.gif"
    - "!**/*.pdf"
    - "!**/*.lock"
    - "!**/pnpm-lock.yaml"
    - "!**/yarn.lock"
    - "!**/package-lock.json"
    - "!**/dist/**"
    - "!**/.next/**"
    - "!**/coverage/**"
    - "!**/*.snap"
    - "!packages/supabase/types/supabase.types.ts"

  auto_review:
    enabled: true
    drafts: true
    # "!" は除外条件。これらのラベルが付いたPRはレビューしない
    labels:
      - "!skip-ai-review"
      - "!no-bots"
      - "!dependencies"
    ignore_usernames:
      - "dependabot[bot]"
      - "renovate[bot]"

chat:
  auto_reply: true
